# Wellyboot BI as a Docker Compose stack. From the repository root:
#   docker compose up -d --build              # the app on http://localhost:8090, the server on http://localhost:8787
#   docker compose --profile tunnel up -d     # also a Cloudflare Tunnel (needs CLOUDFLARE_TUNNEL_TOKEN)
# Settings come from the environment or a .env file next to this one. See deploy/README.md.
services:
  web:
    image: ${WELLYBOOT_WEB_IMAGE:-wellyboot-web:latest}
    build:
      context: .
    restart: unless-stopped
    read_only: true
    # nginx keeps its pid and temporary files here.
    tmpfs: [/tmp]
    ports: ['${WELLYBOOT_WEB_PORT:-8090}:8080']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  server:
    image: ${WELLYBOOT_SERVER_IMAGE:-wellyboot-server:latest}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    read_only: true
    ports: ['${WELLYBOOT_SERVER_PORT:-8787}:8787']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8787/healthz']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy
