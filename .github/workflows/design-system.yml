name: Design system drift

# Wellyboot BI vendors Puddle's design system. Once a week (or on demand) this checks the vendored files against
# Puddle's main branch, so a change there shows up here as a failed run rather than going unnoticed. It doesn't
# run on pull requests: a Puddle change shouldn't block unrelated work. Fix a failure with
# `npm run design-system -- sync <puddle-checkout>` in apps/web.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    name: Compare with Puddle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out Puddle
        run: git clone --depth 1 https://github.com/kevinmcaleer/puddle "$RUNNER_TEMP/puddle"
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
      - name: Compare the vendored files
        working-directory: apps/web
        run: npm run design-system -- check "$RUNNER_TEMP/puddle"
